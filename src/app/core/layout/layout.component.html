<div class="layout-container">
  <aside class="sidebar-desktop">
    <div class="sidebar-header">
      <span class="app-title">GameVault</span>
    </div>
    <ul class="menu">
      <li>
        <a
          routerLink="/games"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
        >
          <i class="pi pi-list"></i>
          <span>Lista gier</span>
        </a>
      </li>
      <li>
        <a routerLink="/analysis" routerLinkActive="active">
          <i class="pi pi-chart-bar"></i>
          <span>Analizy</span>
        </a>
      </li>
    </ul>
  </aside>

  <div class="main-content">
    <app-header (menuToggle)="toggleSidebar()" />

    @if (sidebarVisible()) {
      <div class="sidebar-overlay" (click)="sidebarVisible.set(false)">
        <aside class="sidebar-mobile" (click)="$event.stopPropagation()">
          <div class="sidebar-header">
            <span class="app-title">GameVault</span>
          </div>
          <ul class="menu">
            <li>
              <a routerLink="/games" routerLinkActive="active" (click)="sidebarVisible.set(false)">
                <i class="pi pi-list"></i>
                <span>Lista gier</span>
              </a>
            </li>
            <li>
              <a
                routerLink="/analysis"
                routerLinkActive="active"
                (click)="sidebarVisible.set(false)"
              >
                <i class="pi pi-chart-bar"></i>
                <span>Analizy</span>
              </a>
            </li>
          </ul>
        </aside>
      </div>
    }

    @if (showAddButton()) {
      <div class="add-game-container">
        <p-button
          label="Dodaj grę"
          icon="pi pi-plus"
          [routerLink]="['/games', 'new']"
          styleClass="add-game-button"
        ></p-button>
      </div>
    }

    <main class="app-main">
      <router-outlet />
    </main>
  </div>
</div>
